spring.application.name=paris2024api

#Tomcat configuration
server.port=9005

#Log level configuration
logging.level.root=error
logging.level.bts.sio=info
logging.level.org.springframework.boot.autoconfigure.mariadb=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

#Mariadb Database configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/paris2024api
spring.datasource.username=root
spring.datasource.password=
## spring.datasource.url=jdbc:mariadb://172.20.177.251:3306/brianparis2024
## spring.datasource.username=brian
## spring.datasource.password=mpbrian
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

#Springdoc configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true